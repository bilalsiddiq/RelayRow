<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" width="236" height="64" role="img" aria-label="RelayRow">
  <title>RelayRow horizontal lockup — for dark backgrounds</title>
  <defs>
    <linearGradient id="rrLockDA" x1="6" y1="38" x2="58" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="rrLockDB" x1="150" y1="46" x2="220" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
